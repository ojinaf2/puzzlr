name = "puzzlr-rooms"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# new_sqlite_classes, not new_classes: the SQLite-backed storage backend is the
