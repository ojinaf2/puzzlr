name = "puzzlr-rooms"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# One instance, holding the list of rooms open to join. Durable Objects cannot
# see each other, so without a registry like this there is no way to answer
# "what rooms exist?" — each room announces itself here as it changes.
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# new_sqlite_classes, not new_classes: the SQLite-backed storage backend is the
# one available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# One instance per game, holding every variant of that game's board. Separate
# from Room because the lifetimes are opposite: a room is forgotten after half
# an hour, a leaderboard is meant to outlive everyone who is playing today.
[[durable_objects.bindings]]
name = "LEADERBOARDS"
class_name = "Leaderboard"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Leaderboard"]

[observability]
enabled = true
