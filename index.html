<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- No game count in any of these, and no exhaustive list either: a count
         goes stale the moment a game is added, and naming every game is a
         count Google can do for itself. "and more" keeps the keywords without
         needing an edit per game. -->
    <title>Puzzlr — browser puzzle games with friends, no sign-up</title>
    <meta name="description" content="Free browser puzzle games — Wordl Unlimited, Minesweeper, Snake, Connect 4 and more. Play solo or with friends over an invite link. No sign-up, no downloads." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#b5651d" />

    <!-- Applies the saved theme before the first paint. Without this the page
         renders light and then flips, which is the flash every dark-mode site
         gets wrong. Deliberately inline and synchronous: a deferred script
         would run too late to help. Mirrors src/shared/theme.js. -->
    <script>
      try {
        var t = localStorage.getItem('puzzlr:theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>

    <!-- Link previews in messages, chats and feeds. These must be absolute URLs,
         so they point at the live domain rather than the vercel.app address. -->
    <link rel="canonical" href="https://playpuzzlr.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Puzzlr" />
    <meta property="og:title" content="Puzzlr — browser puzzle games with friends, no sign-up" />
    <meta property="og:description" content="Wordl Unlimited, Minesweeper, Snake, Connect 4 and more. Play solo, or with friends over an invite link. No sign-up, no apps." />
    <meta property="og:url" content="https://playpuzzlr.com/" />
    <meta property="og:image" content="https://playpuzzlr.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Puzzlr — free browser puzzle games" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Puzzlr — browser puzzle games with friends, no sign-up" />
    <meta name="twitter:description" content="Wordl Unlimited, Minesweeper, Snake, Connect 4 and more. Play solo or with friends. No sign-up, no apps." />
    <meta name="twitter:image" content="https://playpuzzlr.com/og.jpg" />

    <!-- Add to Home Screen -->
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Puzzlr" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23b5651d'/%3E%3Ctext x='16' y='23' font-family='Times New Roman, serif' font-size='21' font-weight='700' fill='white' text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
